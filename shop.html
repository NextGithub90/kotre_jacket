<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Collection - SYUPERMARKET.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Nunito Sans"', 'sans-serif'] },
                    colors: { primary: '#4361ee', secondary: '#f8f9fa', dark: '#212529' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Nunito Sans', sans-serif; overflow-x: hidden; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white dark:bg-gray-900 text-dark dark:text-gray-100 transition-colors duration-300 flex flex-col min-h-screen">

    <nav class="w-full bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 py-6 z-50 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="text-2xl font-bold tracking-widest uppercase cursor-pointer">
                <a href="index.html">SYUPERMARKET<span class="text-primary text-3xl leading-none">.</span></a>
            </div>
            <div class="flex items-center space-x-8 text-dark dark:text-white">
                <button id="theme-toggle" class="hover:text-primary transition-colors duration-200 cursor-pointer flex items-center justify-center outline-none"><i data-lucide="moon" class="w-5 h-5 theme-icon"></i></button>
                <button id="mobile-menu-btn" class="hover:text-primary z-[60] relative cursor-pointer flex items-center justify-center outline-none"><i data-lucide="menu" class="w-6 h-6"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Sidebar Backdrop -->
    <div id="mobile-backdrop" class="fixed inset-0 bg-black/60 z-[70] opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-sm"></div>

    <!-- Mobile Sidebar -->
    <div id="mobile-sidebar" class="fixed top-0 right-0 h-full w-[350px] bg-white dark:bg-gray-900 z-[80] transform translate-x-full transition-transform duration-500 ease-out shadow-2xl flex flex-col">
        <div class="px-8 py-6 w-full flex justify-between items-center border-b border-gray-100 dark:border-gray-800">
            <h2 class="text-xl font-bold tracking-widest text-dark dark:text-white uppercase">Menu</h2>
            <button id="mobile-close-btn" class="text-gray-400 hover:text-primary transition-colors cursor-pointer p-2 -mr-2 outline-none"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="flex flex-col p-8 space-y-6 text-sm font-bold tracking-[0.2em] uppercase text-gray-500 dark:text-gray-400">
            <a href="index.html" class="hover:text-dark dark:hover:text-white mobile-link transition-colors">Home</a>
            <a href="shop.html" class="text-primary mobile-link transition-colors">Shop</a>
            <a href="#" class="hover:text-dark dark:hover:text-white mobile-link transition-colors">Collection</a>
            <a href="about.html" class="hover:text-dark dark:hover:text-white mobile-link transition-colors">About</a>
            <a href="#" class="hover:text-dark dark:hover:text-white mobile-link transition-colors">Blog</a>
            <a href="#" class="hover:text-dark dark:hover:text-white mobile-link transition-colors">Contact Us</a>
        </div>
        <div class="px-8 pb-6 text-sm font-bold tracking-widest flex flex-col space-y-6">
            <a href="cart.html" class="flex items-center hover:text-primary dark:text-white transition-colors border-t border-gray-100 dark:border-gray-800 pt-6">
                <i data-lucide="shopping-bag" class="w-5 h-5 mr-3"></i> Cart (<span id="cart-count">0</span>)
            </a>
            <a href="#" class="flex items-center hover:text-primary dark:text-white transition-colors">
                <i data-lucide="user" class="w-5 h-5 mr-3"></i> My Account
            </a>
        </div>
        <div class="mt-auto p-8 border-t border-gray-100 dark:border-gray-800 flex justify-center space-x-6 text-gray-400">
            <i data-lucide="instagram" class="w-5 h-5 cursor-pointer hover:text-primary"></i>
            <i data-lucide="facebook" class="w-5 h-5 cursor-pointer hover:text-primary"></i>
        </div>
    </div>

    <!-- Shop Header -->
    <header class="w-full pt-16 pb-12 bg-gray-50 dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 text-center">
        <h1 class="text-4xl md:text-5xl font-bold uppercase tracking-widest text-dark dark:text-white mb-4">The Collection</h1>
        <p class="text-gray-500 dark:text-gray-400 tracking-wide text-sm font-semibold max-w-2xl mx-auto">Explore all 60 exclusive pieces curated by AI intelligence.</p>
    </header>

    <!-- Detailed Grid -->
    <main class="flex-grow max-w-[1400px] mx-auto px-6 py-16 w-full">
        <!-- The Dynamic JS Grid -->
        <div id="dynamic-full-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-6 gap-y-12">
            <!-- Filled by main.js via galleryDB -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 dark:bg-gray-900 py-12 border-t border-gray-200 dark:border-gray-800 mt-auto text-center">
        <h2 class="text-2xl font-bold tracking-widest mb-6">SYUPERMARKET<span class="text-primary">.</span></h2>
        <p class="text-xs text-gray-400 font-semibold tracking-widest">&copy; 2026 SYUPERMARKET. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- Scripts -->
    <script src="./js/gallery.js?v=4"></script>
    <script src="./js/main.js?v=4"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
